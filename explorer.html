<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine+</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style2.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background-color: #7c0505;">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="images/logo.png" alt="Logo" width="120" height="auto">
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a href="explorer.html" class="btn btn-light btn-custom">Explorar</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="container my-5">
        <h2 class="mb-4 text-light text-center">Explore Séries</h2>
        <div class="row">
            <div class="col-md-3">
                <div class="filter-section mb-4">
                    <h4>Filtros</h4>
                    <!-- Seção de Filtros -->
                    <div class="filter-section mb-4">
                        <h4>Filtros</h4>
                        <div id="genre-filters" class="form-check">
                            <!-- Os filtros de gênero serão preenchidos aqui -->
                        </div>
                        <button class="btn btn-primary mt-3" id="apply-filters-btn">Aplicar Filtros</button>
                    </div>
                    

                    <div id="genre-filters"></div>
                </div>
            </div>

            <div class="col-md-9">
                <form id="search-form" class="mb-4">
                    <div class="input-group">
                        <input type="text" class="form-control" id="search-input" placeholder="Pesquise por uma série...">
                        <button class="btn btn-danger" type="submit">Buscar</button>
                    </div>
                </form>

                <div id="results" class="row row-cols-1 row-cols-md-3 g-4"></div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <p>&copy; 2024 Cine+. Todos os direitos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script2.js"></script> <!-- Vinculando o arquivo JS -->
</body>
</html>
